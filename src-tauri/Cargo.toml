[package]
name = "off-player"
version = "1.0.0"
description = "Off Player: watch what you own, find what to watch next"
authors = ["Off Player"]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/kr40/off-player"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "off_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-libmpv = "0.3.2"
walkdir = "2.5.0"
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
tauri-plugin-dialog = "2.8.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "query", "blocking"] }
flate2 = "1"
tauri-plugin-window-state = "2.5.0"
rusty-chromaprint = "0.3.0"


# Audio fingerprinting is FFT-heavy and ~10x slower unoptimised; keep dev builds
# and tests representative of the release build's speed.
[profile.dev.package.rusty-chromaprint]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
